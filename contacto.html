<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Astana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html" class="titulo">
            <img src="img/logo-camion.png" alt="logo de la empresa">
            Astana</a>
        <nav class="menu">
            <a href="index.html" class="enlace">Principal</a>
            <a href="productos.html" class="enlace">Productos</a>
            <a href="contacto.html" class="enlace activo">Contacto</a>
        </nav>
    </header>
    <main>
        <section class="contacto">
            <form id="form-contacto" novalidate>
                <div class="form-info">
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" name="nombre" id="nombre" required>
                    <p class="error" id="error-nombre"></p>
                </div>
                <div class="form-info">
                    <label for="mail">Correo Electronico:</label>
                    <input type="email" name="mail" id="mail" required>
                    <p class="error" id="error-mail"></p>
                </div>
                <div class="form-info">
                    <label for="telefono">Telefono:</label>
                    <input type="tel" name="telefono" id="telefono" required>
                    <p class="error" id="error-telefono"></p>
                </div>
                <div class="form-info">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5"></textarea>
                    <p class="error" id="error-mensaje"></p>
                </div>
                <button type="submit" class="boton-enviar">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pie">
        <p>📧 Contacto: astanadistribuidorasl@hotmail.com | 📞 Tel: </p>
        <p>&copy; 2026 Astana Distribuidora - Todos los derechos reservados.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
